name: CI

# Gate de calidad en cada PR a main: impide meter a main código que no compila, no pasa
# el linter, no está formateado, o que rompe una de las cosas que este repo ha decidido
# vigilar. Coherente con el argumento de rigor técnico del sitio (PRD §1).
#
# QUÉ PASOS SON, NO SE ESCRIBE AQUÍ. Se leen abajo, que es donde no pueden mentir: esta
# cabecera enumeró cinco durante once pasos, mientras el comentario del `name:` —treinta
# líneas más abajo— argumentaba justo eso. La regla estaba escrita y el mismo archivo la
# incumplía.
#
# `format:check` entra aquí en P37.5991, cuando dejó de estar rojo por defecto: con
# CRLF en el working tree reportaba 57 falsos positivos, así que meterlo en CI habría
# sido bloquear todos los PR por ruido. Un check solo sirve de gate si su verde
# significa algo — y solo se mantiene verde si algo lo comprueba.

on:
  pull_request:
    branches: [main]
  # También en push directo a main como red de seguridad (hotfixes, merges de otras vías).
  push:
    branches: [main]

# El GITHUB_TOKEN de este workflow solo necesita leer el repo: aquí no se publica
# nada, no se escriben comentarios ni releases. Sin este bloque hereda los permisos
# por defecto del repositorio, que pueden ser de escritura.
permissions:
  contents: read

# Un push nuevo a la misma rama cancela el run anterior en curso.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # El nombre NO enumera los pasos. Enumerarlos deriva por construcción: decía
    # «format · typecheck · lint · palette · build» cuando ya había ocho, así que
    # llevaba tres pasos sin nombrar (experiencias, CV y raya). Los pasos se leen
    # abajo, que es donde no pueden mentir.
    name: calidad y build
    runs-on: ubuntu-latest
    steps:
      # Las acciones se fijan por SHA de commit, no por tag: un tag es un puntero
      # movible, así que `@v7` es «lo que su dueño diga hoy». Dependabot mantiene el
      # SHA al día y actualiza el comentario de versión con él.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout deja el token en .git/config para que pasos posteriores puedan
          # usarlo. Aquí ninguno lo necesita, y ese fichero viaja dentro de cualquier
          # artefacto que se suba desde el workspace.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Compara la paleta de lib/design-values.ts con la de app/globals.css. Va
      # aquí porque es el único sitio donde se puede ver: el mock de tema del Design
      # System y las imágenes OG copian valores de token a mano por necesidad —pintan
      # la paleta contraria a la vigente, o las genera Satori, que no lee CSS vars— y
      # una copia que diverge no la detectan ni axe, ni el typecheck, ni el ojo.
      #
      # Y desde D90 mira una segunda cosa de la misma familia: si ha aparecido un
      # token de color, una superficie o una animación que el censo de contraste
      # NO ha visto. El censo no puede correr aquí —necesita navegador (D85)—,
      # pero comparar su sello sí, y eso convierte la condición de re-medir de la
      # DoD en un rojo con nombre en vez de un párrafo que hay que acordarse de
      # leer.
      - name: Palette
        run: npm run check:palette

      # De una experiencia se cuenta lo mismo en tres longitudes —la frase de
      # Trayectoria, el bullet del CV y su gemelo del deep-dive— y ahora viven en
      # el mismo objeto (P48.5). Lo que la estructura no puede garantizar lo
      # comprueba esto: que ES y EN tengan la misma cobertura, que tenga versión
      # larga quien tiene página, y que una cifra no viva en una longitud y falte
      # en la otra. Mismo giro que la paleta —se busca la AUSENCIA, no el patrón—
      # y por la misma razón: ocho divergencias reales que no veía nadie.
      - name: Experiencias
        run: npm run check:experiencias

      # Los PDFs del CV son un artefacto COMMITEADO, así que la fuente única no
      # basta: garantiza que no haya dos verdades, no que la copia impresa esté al
      # día. El 2026-08-18 un cambio de sector en `content/experience-copy/` dejó
      # los dos PDFs viejos y no lo vio nada — ni el typecheck, ni el linter, ni
      # `gate:html`, ni `check:experiencias`. Esto compara la huella de lo que
      # ENTRA en el CV contra el sello que dejó la última generación (el PDF en sí
      # no es determinista, así que comparar bytes no sirve; está medido).
      - name: CV al día
        run: npm run check:cv

      # El 2026-08-18 se barrieron 357 rayas (—) del copy servido: es una señal
      # visual de texto escrito por IA y casi nunca decía nada que no dijera una
      # coma. Un barrido sin guardián se deshace solo, y el bloque siguiente
      # («Cómo se ha creado esta página») es el que más copy nuevo escribe. Mismo
      # giro que la paleta y las experiencias —se busca la AUSENCIA— y con las dos
      # únicas excepciones escritas: el ordinal de una cabecera (D43) y la celda
      # «no aplica» de una tabla. No mira comentarios ni `*.md`, a propósito.
      - name: Raya en el copy
        run: npm run check:raya

      # El SVG del deep-dive es un artefacto COMMITEADO derivado del `.mmd` y del
      # saneador, o sea la familia de D60 en su segunda instancia: una fuente única
      # evita dos verdades, pero no mantiene al día una copia impresa. Y ya falló
      # una vez por esa vía (D54 publicó el diagrama sin sanear). Aquí se sella el
      # PAR fuente→producto, que se pudo porque se midió: al revés que el PDF, el
      # artefacto SÍ es determinista.
      - name: Artefacto al día
        run: npm run check:artefacto

      # Techo al contexto que se `@`-importa en cada sesión. D28 escribió el
      # régimen y no le puso ni cifra ni guardián, así que se cumplió cuatro días:
      # de 9.275 palabras a 19.805 en diez. Esto es coste fijo de cada arranque.
      - name: Contexto de arranque
        run: npm run check:contexto

      # Las skills CADUCAN PEOR que los `.md` porque se siguen en vez de leerse
      # (D60: `update-cv` acumuló nueve afirmaciones falsas en un día). Comprueba
      # la parte mecánica: que las rutas y los `npm run` que nombran existan.
      - name: Skills al día
        run: npm run check:skills

      # La mitad «a demanda» del régimen de contexto (D28) son ~97.000 palabras, y
      # solo funciona si se sabe QUÉ HAY dentro sin cargarlo. Los tres índices se
      # derivan de las cabeceras y los tres viven en la cabecera de su propio
      # archivo, para no costar nada en el arranque: el de decisiones estaba dentro
      # de `CLAUDE.md` y era el único que crecía sin límite (D88).
      - name: Índices derivados
        run: npm run check:indices

      # «Qué páginas tiene este sitio» estaba escrito a mano en TRES sitios —el
      # sitemap, este gate de HTML y /llms.txt— y en ninguno fallaba de forma
      # visible: la página no existe para Google, el gate deja de cubrirla en
      # silencio, y no aparece en el índice para modelos. Ahora la lista es una
      # (lib/routes.ts) y esto comprueba que cuadre con app/[lang]/**/page.tsx,
      # que es el único sitio donde una página existe de verdad (D72).
      - name: Rutas registradas
        run: npm run check:rutas

      # «Cómo se ha creado esta página» describe un proyecto que sigue cambiando, y
      # sus afirmaciones caducan sin avisar: la cifra de páginas ya iba una por
      # detrás, y 27 de sus 38 permalinks a DECISIONS.md apuntaban diez líneas
      # arriba desde que un addendum de D26 desplazó el archivo. Cada sección
      # declara de qué depende y lleva su sello; cuando una fuente se mueve, esto
      # sale rojo NOMBRANDO la sección, en el PR que la mueve — no al cerrar la
      # etapa, que es cuando lo vería `sprint-review` (D84).
      - name: Artículo al día
        run: npm run check:articulo

      - name: Build
        run: npm run build

      # Los dos pasos que miden el HTML que el sitio EMITE, no el código que lo
      # genera, así que van detrás del build y no delante.
      #
      # El criterio de cierre de página nueva —los 8 puntos de accesibilidad, el
      # enlace de salto, el SEO y su JSON-LD— se cumplía A MANO y dependía de
      # acordarse, que es el patrón que BRAND.md §Cómo se escribe una regla nombra
      # como el que produce drift. La mitad ya no se puede romper: pageMetadata y
      # PageShell la DERIVAN (D45). Esto mira la otra mitad: lo que pone quien
      # ESCRIBE la página, que la derivación LLEGÓ —los helpers son opt-in, y una
      # página que se escriba su metadata a mano compila igual— y que las
      # referencias `@id` entre páginas resuelven, cosa que ningún validador
      # externo hace. Contraste y objetivo táctil NO están: necesitan navegador y
      # tema, los cubre viewport-verifier (D52), y además se HEREDAN de la capa de
      # componentes. Cuesta segundos porque lee el prerender, y por eso puede
      # correr en cada PR en vez de ser un nightly.
      - name: Marco de página
        run: npm run check:marco

      # Y el que mira a todos los demás: a cada guardián le pasa un caso malo
      # conocido y comprueba que lo RECHAZA. Es lo contrario de un test de que
      # funciona — el modo de fallo de un guardián es una luz verde, y el censo de
      # contraste se rompió así dos veces en silencio (D70). Nació FUERA de CI
      # porque muta archivos rastreados para provocar el fallo, y eso sale caro en
      # un árbol de trabajo con cosas dentro; en un runner que se tira al terminar,
      # no. Exige árbol limpio, restaura desde memoria y falla si queda algo movido.
      # Va el ÚLTIMO desde P58.5: su caso de `check:marco` muerde el HTML del
      # build, que es la entrada de ese guardián, y sin `.next` no se podría probar.
      - name: Guardianes con dientes
        run: npm run check:guardianes
