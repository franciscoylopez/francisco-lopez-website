name: CI

# Gate de calidad en cada PR a main: formato + typecheck + lint + paleta + build. Hoy nada
# bloquea el merge salvo el preview de Vercel (que no es un gate); esto impide meter
# a main código que no compila, no pasa el linter o no está formateado. Coherente
# con el argumento de rigor técnico del sitio (PRD §1).
#
# `format:check` entra aquí en P37.5991, cuando dejó de estar rojo por defecto: con
# CRLF en el working tree reportaba 57 falsos positivos, así que meterlo en CI habría
# sido bloquear todos los PR por ruido. Un check solo sirve de gate si su verde
# significa algo — y solo se mantiene verde si algo lo comprueba.

on:
  pull_request:
    branches: [main]
  # También en push directo a main como red de seguridad (hotfixes, merges de otras vías).
  push:
    branches: [main]

# El GITHUB_TOKEN de este workflow solo necesita leer el repo: aquí no se publica
# nada, no se escriben comentarios ni releases. Sin este bloque hereda los permisos
# por defecto del repositorio, que pueden ser de escritura.
permissions:
  contents: read

# Un push nuevo a la misma rama cancela el run anterior en curso.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format · typecheck · lint · palette · build
    runs-on: ubuntu-latest
    steps:
      # Las acciones se fijan por SHA de commit, no por tag: un tag es un puntero
      # movible, así que `@v7` es «lo que su dueño diga hoy». Dependabot mantiene el
      # SHA al día y actualiza el comentario de versión con él.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout deja el token en .git/config para que pasos posteriores puedan
          # usarlo. Aquí ninguno lo necesita, y ese fichero viaja dentro de cualquier
          # artefacto que se suba desde el workspace.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Compara la paleta de lib/design-values.ts con la de app/globals.css. Va
      # aquí porque es el único sitio donde se puede ver: el mock de tema del Design
      # System y las imágenes OG copian valores de token a mano por necesidad —pintan
      # la paleta contraria a la vigente, o las genera Satori, que no lee CSS vars— y
      # una copia que diverge no la detectan ni axe, ni el typecheck, ni el ojo.
      - name: Palette
        run: npm run check:palette

      # De una experiencia se cuenta lo mismo en tres longitudes —la frase de
      # Trayectoria, el bullet del CV y su gemelo del deep-dive— y ahora viven en
      # el mismo objeto (P48.5). Lo que la estructura no puede garantizar lo
      # comprueba esto: que ES y EN tengan la misma cobertura, que tenga versión
      # larga quien tiene página, y que una cifra no viva en una longitud y falte
      # en la otra. Mismo giro que la paleta —se busca la AUSENCIA, no el patrón—
      # y por la misma razón: ocho divergencias reales que no veía nadie.
      - name: Experiencias
        run: npm run check:experiencias

      # Los PDFs del CV son un artefacto COMMITEADO, así que la fuente única no
      # basta: garantiza que no haya dos verdades, no que la copia impresa esté al
      # día. El 2026-08-18 un cambio de sector en `content/experience-copy/` dejó
      # los dos PDFs viejos y no lo vio nada — ni el typecheck, ni el linter, ni
      # `gate:html`, ni `check:experiencias`. Esto compara la huella de lo que
      # ENTRA en el CV contra el sello que dejó la última generación (el PDF en sí
      # no es determinista, así que comparar bytes no sirve; está medido).
      - name: CV al día
        run: npm run check:cv

      - name: Build
        run: npm run build
